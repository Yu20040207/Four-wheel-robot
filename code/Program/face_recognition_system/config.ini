; MQTT 连接配置
[mqtt]
; MQTT Broker 地址（IP或域名）
broker_host = 192.168.13.225
; MQTT Broker 端口（默认 1883）
broker_port = 1883
; 用户名（如果不需认证，留空即可）
username = sy
; 密码（如果不需认证，留空即可）
password = 123

[auth]
; Session 加密密钥（生产环境请改为随机长字符串）
secret_key = change-me-to-a-random-secret-key
; 首次启动且无用户时自动创建的管理员账号
admin_username = admin
admin_password = admin123