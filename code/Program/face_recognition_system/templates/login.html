<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户登录 - 机器人控制台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 2.5rem;
        }
        .login-title { font-weight: 700; color: #333; }
        .login-sub { color: #6c757d; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="login-title mb-1">机器人控制台</h2>
        <p class="login-sub mb-4">请使用客户账号登录</p>

        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" required autofocus
                       placeholder="客户账号">
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" name="remember" id="remember">
                <label class="form-check-label" for="remember">记住登录</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">登录</button>
        </form>

        <p class="text-muted small mt-4 mb-0 text-center">
            管理员请访问独立管理入口，此处不提供管理功能。<br>
            同一浏览器只能保持一个登录账号；测试多个用户请使用无痕窗口或不同浏览器。
        </p>
    </div>
</body>
</html>
