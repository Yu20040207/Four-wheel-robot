<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .form-control { background: #334155; border-color: #475569; color: #fff; }
        .form-control:focus { background: #334155; color: #fff; border-color: #64748b; }
        .form-label { color: #94a3b8; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="mb-1">管理后台</h2>
        <p class="text-secondary mb-4">仅管理员可登录</p>

        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form method="post">
            <div class="mb-3">
                <label class="form-label">管理员账号</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" name="remember" id="remember">
                <label class="form-check-label" for="remember">记住登录</label>
            </div>
            <button type="submit" class="btn btn-light w-100">进入管理后台</button>
        </form>
    </div>
</body>
</html>
