<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}管理后台{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f4f6f9; }
        .admin-nav {
            background: #1e293b;
            color: #fff;
            padding: 0.75rem 0;
        }
        .admin-nav a { color: #cbd5e1; text-decoration: none; margin-right: 1.25rem; }
        .admin-nav a:hover, .admin-nav a.active { color: #fff; }
        .admin-content { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    </style>
</head>
<body>
    <nav class="admin-nav">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <div>
                <strong><i class="fas fa-shield-alt me-2"></i>机器人管理后台</strong>
                <a href="{{ url_for('admin.dashboard') }}" class="ms-4 {% if request.path == '/admin/' %}active{% endif %}">概览</a>
                <a href="{{ url_for('admin.users_page') }}" class="{% if '/admin/users' in request.path %}active{% endif %}">用户</a>
                <a href="{{ url_for('admin.robots_page') }}" class="{% if '/admin/robots' in request.path %}active{% endif %}">机器人</a>
                <a href="{{ url_for('admin.bindings_page') }}" class="{% if '/admin/bindings' in request.path %}active{% endif %}">绑定</a>
            </div>
            <div>
                <span class="text-muted small me-3">{{ current_user.username }}</span>
                <a href="{{ url_for('index') }}" class="me-3"><i class="fas fa-external-link-alt"></i> 控制台</a>
                <a href="{{ url_for('admin.logout') }}"><i class="fas fa-sign-out-alt"></i> 退出</a>
            </div>
        </div>
    </nav>

    <main class="admin-content">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
